<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="nurseryBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBF7"/>
      <stop offset="50%" stop-color="#F5ECE1"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </radialGradient>
    <linearGradient id="knitBlanket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#EDE2D3"/>
      <stop offset="100%" stop-color="#DECBB5"/>
    </linearGradient>
  </defs>

  <!-- Warm Peaceful Nursery Atmosphere -->
  <rect width="1080" height="1080" fill="url(#nurseryBg)"/>

  <!-- Swaddle Blanket Folds -->
  <ellipse cx="540" cy="650" rx="360" ry="260" fill="url(#knitBlanket)"/>
  <ellipse cx="540" cy="650" rx="340" ry="240" fill="#FBF7F0"/>

  <!-- Knitted Cable Texture details -->
  <path d="M260 580 Q 300 640 260 700 Q 300 760 260 820" stroke="#D1BEA8" stroke-width="6" fill="none" opacity="0.4"/>
  <path d="M360 540 Q 400 620 360 700 Q 400 780 360 860" stroke="#D1BEA8" stroke-width="6" fill="none" opacity="0.4"/>
  <path d="M720 540 Q 680 620 720 700 Q 680 780 720 860" stroke="#D1BEA8" stroke-width="6" fill="none" opacity="0.4"/>
  <path d="M820 580 Q 780 640 820 700 Q 780 760 820 820" stroke="#D1BEA8" stroke-width="6" fill="none" opacity="0.4"/>

  <!-- Sleeping Baby -->
  <g transform="translate(420, 380)">
    <!-- Head in soft knitted bonnet -->
    <ellipse cx="120" cy="120" rx="90" ry="85" fill="#E6DAC8"/>
    <!-- Face -->
    <ellipse cx="120" cy="130" rx="72" ry="70" fill="#FCE9DE"/>
    <!-- Rosy cheeks -->
    <circle cx="75" cy="150" r="18" fill="#FFB7B2" opacity="0.5"/>
    <circle cx="165" cy="150" r="18" fill="#FFB7B2" opacity="0.5"/>
    <!-- Sleeping closed eyelashes -->
    <path d="M80 130 Q 95 142 110 130" stroke="#7A5643" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M130 130 Q 145 142 160 130" stroke="#7A5643" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Tiny button nose -->
    <ellipse cx="120" cy="148" rx="5" ry="3" fill="#E8B59E"/>
    <!-- Sweet sleeping lips -->
    <path d="M112 165 Q 120 170 128 165" stroke="#E07A72" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Bonnet brim rim -->
    <path d="M38 120 Q 120 75 202 120" stroke="#FFF" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Tiny baby hand resting on blanket -->
    <ellipse cx="60" cy="230" rx="22" ry="18" fill="#FCE9DE"/>
    <circle cx="50" cy="225" r="5" fill="#FCE9DE"/>
    <circle cx="58" cy="220" r="5" fill="#FCE9DE"/>
    <circle cx="66" cy="222" r="5" fill="#FCE9DE"/>
  </g>

  <!-- Gentle Golden Dream Sparks -->
  <circle cx="280" cy="240" r="4" fill="#FFD166" opacity="0.8"/>
  <circle cx="820" cy="280" r="5" fill="#FFD166" opacity="0.8"/>
  <circle cx="740" cy="200" r="3" fill="#FFD166" opacity="0.6"/>
  <circle cx="340" cy="300" r="3" fill="#FFD166" opacity="0.6"/>
</svg>
